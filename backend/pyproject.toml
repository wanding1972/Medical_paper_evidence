[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-check"
version = "0.1.0"
description = "Closed-corpus medical evidence audit workbench"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "fastapi>=0.141,<1", "python-docx>=1.2,<2", "pymupdf>=1.26,<2", "cryptography>=46,<51", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "uvicorn>=0.30,<1", "jsonschema>=4.25,<5", "filelock>=3.20,<4"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "uvicorn>=0.30,<1"]

[project.scripts]
evidence-check = "evidence_check.entrypoints.cli:main"
evidence-server = "evidence_check.entrypoints.server:main"
evidence-evaluate = "evidence_check.entrypoints.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evidence_check.entrypoints" = ["assets/*"]
